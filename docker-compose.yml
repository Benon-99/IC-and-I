version: '3.8'

networks:
  traefik-public:
    external: true
  internal:
    external: false

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY=0x4AAAAAAAA86Lh2tin-8Dvww
        - NEXT_PUBLIC_API_URL=https://technoian.com/api
        - NEXT_PUBLIC_APP_URL=https://technoian.com
    container_name: technoian-frontend
    restart: unless-stopped
    networks:
      - traefik-public
      - internal
    environment:
      - NODE_ENV=production
      - EMAIL_USER=bmeqdkhanian@gmail.com
      - EMAIL_PASS=qmamjpofdothakfv
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.technoian-frontend.rule=Host(`technoian.com`) && PathPrefix(`/`)"
      - "traefik.http.routers.technoian-frontend.entrypoints=websecure"
      - "traefik.http.routers.technoian-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.technoian-frontend.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.technoian-frontend.priority=1"

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: technoian-backend
    restart: unless-stopped
    networks:
      - traefik-public
      - internal
    environment:
      # Environment
      - NODE_ENV=production
      
      # Server Configuration
      - PORT=3002
      - ALLOWED_ORIGINS=https://technoian.com
      
      # Database Configuration
      - DATABASE_URL=mysql://root:@db:3306/ici
      
      # Authentication
      - JWT_SECRET=123456
      
      # Frontend Reference
      - FRONTEND_URL=https://technoian.com
      
      # Email Configuration
      - EMAIL_USER=bmeqdkhanian@gmail.com
      - EMAIL_PASS=sgheyzjnyysbfak
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.technoian-backend.rule=Host(`technoian.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.technoian-backend.entrypoints=websecure"
      - "traefik.http.routers.technoian-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.technoian-backend.loadbalancer.server.port=3002"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.technoian-backend.priority=10"

  db:
    image: mysql:8
    container_name: technoian-db
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    environment:
      - MYSQL_ROOT_PASSWORD=mysqlpassword
      - MYSQL_DATABASE=ici
      - MYSQL_USER=technoian_user
      - MYSQL_PASSWORD=technoian_password
    command: --default-authentication-plugin=mysql_native_password
    cap_add:
      - SYS_NICE  # Helps with MySQL performance issues

volumes:
  mysql_data: